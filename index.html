<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>R E P O - 2D Salvage Prototype</title>
    <style>
        body {
            margin: 0;
            background-color: #050505;
            color: #d4af37;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        h1 { margin-bottom: 5px; letter-spacing: 5px; text-shadow: 0 0 10px #ff3300; }
        #gameUi { font-size: 16px; margin-bottom: 10px; display: flex; gap: 30px; }
        canvas { border: 3px solid #333; background: #000; box-shadow: 0 0 20px rgba(255,255,255,0.05); }
        .controls { margin-top: 10px; color: #888; font-size: 12px; }
    </style>
</head>
<body>

    <h1>R E P O : 2D</h1>
    <div id="gameUi">
        <div>SCRAP COLLECTED: <span id="quota">0</span> / 3</div>
        <div>STATUS: <span id="status" style="color: #00ff00;">STABLE</span></div>
    </div>
    
    <canvas id="gameCanvas" width="800" height="600"></canvas>
    
    <div class="controls">WASD / Arrow Keys to Move | Mouse to Aim Flashlight | Return to Yellow Base to Extract</div>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

// Game Variables
const player = { x: 70, y: 70, size: 12, speed: 3.5, scrap: 0 };
const elevator = { x: 40, y: 40, size: 50 };
const enemy = { x: 500, y: 450, size: 15, speed: 1.8, active: false };
let mouseX = 0;
let mouseY = 0;
let keys = {};
let scrapList = [];
let gameOver = false;
let gameWon = false;

// Generate Random Scrap
function spawnScrap() {
    scrapList = [];
    for(let i=0; i<3; i++) {
        scrapList.push({
            x: 150 + Math.random() * 550,
            y: 150 + Math.random() * 350,
            size: 8,
            collected: false
        });
    }
}
spawnScrap();

// Input Listeners
window.addEventListener("keydown", e => keys[e.key.toLowerCase()] = true);
window.addEventListener("keyup", e => keys[e.key.toLowerCase()] = false);
canvas.addEventListener("mousemove", e => {
    const rect = canvas.getBoundingClientRect();
    mouseX = e.clientX - rect.left;
    mouseY = e.clientY - rect.top;
});

// Distance helper
function dist(x1, y1, x2, y2) {
    return Math.sqrt((x2 - x1)**2 + (y2 - y1)**2);
}

// Check if an object is within the flashlight beam cone
function inLightCone(targetX, targetY) {
    const angleToMouse = Math.atan2(mouseY - player.y, mouseX - player.x);
    const angleToTarget = Math.atan2(targetY - player.y, targetX - player.x);
    
    let diff = angleToTarget - angleToMouse;
    while (diff < -Math.PI) diff += Math.PI * 2;
    while (diff > Math.PI) diff -= Math.PI * 2;
    
    const coneAngle = Math.PI / 4; // 45 degrees
    const maxDistance = 300;
    
    return Math.abs(diff) < coneAngle && dist(player.x, player.y, targetX, targetY) < maxDistance;
}

// Main Game Loop
function update() {
    if (gameOver || gameWon) return;

    // Player Movement
    if (keys['w'] || keys['arrowup']) player.y -= player.speed;
    if (keys['s'] || keys['arrowdown']) player.y += player.speed;
    if (keys['a'] || keys['arrowleft']) player.x -= player.speed;
    if (keys['d'] || keys['arrowright']) player.x += player.speed;

    // Boundaries
    player.x = Math.max(player.size, Math.min(canvas.width - player.size, player.x));
    player.y = Math.max(player.size, Math.min(canvas.height - player.size, player.y));

    // Enemy AI Stalking
    if (!enemy.active && dist(player.x, player.y, enemy.x, enemy.y) < 250) {
        enemy.active = true; // Enemy wakes up if you get close
    }

    if (enemy.active) {
        const angle = Math.atan2(player.y - enemy.y, player.x - enemy.x);
        enemy.x += Math.cos(angle) * enemy.speed;
        enemy.y += Math.sin(angle) * enemy.speed;
        document.getElementById("status").innerText = "HAZARD DETECTED";
        document.getElementById("status").style.color = "#ff3300";
    }

    // Scrap Collection Check
    scrapList.forEach(scrap => {
        if (!scrap.collected && dist(player.x, player.y, scrap.x, scrap.y) < player.size + scrap.size) {
            scrap.collected = true;
            player.scrap++;
            document.getElementById("quota").innerText = player.scrap;
        }
    });

    // Check Extraction Win Condition
    if (player.scrap >= 3 && dist(player.x, player.y, elevator.x + elevator.size/2, elevator.y + elevator.size/2) < elevator.size/2) {
        gameWon = true;
    }

    // Check Death Collision
    if (dist(player.x, player.y, enemy.x, enemy.y) < player.size + enemy.size) {
        gameOver = true;
    }
}

function draw() {
    // 1. Clear with Pitch Black
    ctx.fillStyle = "#000000";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // 2. Render Light Mask (Flashlight Effect)
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(player.x, player.y);
    const baseAngle = Math.atan2(mouseY - player.y, mouseX - player.x);
    ctx.arc(player.x, player.y, 300, baseAngle - Math.PI/4, baseAngle + Math.PI/4);
    ctx.lineTo(player.x, player.y);
    ctx.clip();

    // --- EVERYTHING INSIDE THE LIGHT IS RENDERED HERE ---
    
    // Grid layout floor lines
    ctx.strokeStyle = "#111111";
    ctx.lineWidth = 1;
    for(let i=0; i<canvas.width; i+=40) {
        ctx.strokeRect(i, 0, 40, canvas.height);
    }

    // Draw Scrap items if they are lit up
    scrapList.forEach(scrap => {
        if (!scrap.collected) {
            ctx.fillStyle = "#00ffff";
            ctx.shadowBlur = 10;
            ctx.shadowColor = "#00ffff";
            ctx.beginPath();
            ctx.arc(scrap.x, scrap.y, scrap.size, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;
        }
    });

    // Draw Enemy if lit up
    if (inLightCone(enemy.x, enemy.y)) {
        ctx.fillStyle = "#ff0033";
        ctx.beginPath();
        ctx.arc(enemy.x, enemy.y, enemy.size, 0, Math.PI * 2);
        ctx.fill();
        // Spooky eye dot
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(enemy.x - 3, enemy.y - 3, 6, 6);
    }

    ctx.restore();
    // --- END OF LIGHT MASK ---

    // 3. Render Always-Visible Assets (Player & Safe Zone)
    
    // Draw Base/Elevator
    ctx.strokeStyle = "#d4af37";
    ctx.lineWidth = 2;
    ctx.strokeRect(elevator.x, elevator.y, elevator.size, elevator.size);
    ctx.fillStyle = "rgba(212, 175, 55, 0.1)";
    ctx.fillRect(elevator.x, elevator.y, elevator.size, elevator.size);

    // Draw Player
    ctx.fillStyle = "#ffffff";
    ctx.beginPath();
    ctx.arc(player.x, player.y, player.size, 0, Math.PI * 2);
    ctx.fill();
    
    // Draw Flashlight line indicator
    ctx.strokeStyle = "rgba(255, 255, 255, 0.3)";
    ctx.beginPath();
    ctx.moveTo(player.x, player.y);
    ctx.lineTo(mouseX, mouseY);
    ctx.stroke();

    // 4. Game States overlays
    if (gameOver) {
        ctx.fillStyle = "rgba(0,0,0,0.85)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "#ff3300";
        ctx.font = "30px Courier New";
        ctx.fillText("ASSETS LOST TO ENVIRONMENT", canvas.width/2 - 220, canvas.height/2);
        ctx.font = "15px Courier New";
        ctx.fillStyle = "#888";
        ctx.fillText("Refresh the page to redeploy.", canvas.width/2 - 130, canvas.height/2 + 40);
    }

    if (gameWon) {
        ctx.fillStyle = "rgba(0,0,0,0.85)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "#00ff00";
        ctx.font = "30px Courier New";
        ctx.fillText("QUOTA MET. EXTRACTION SUCCESS", canvas.width/2 - 250, canvas.height/2);
        ctx.font = "15px Courier New";
        ctx.fillStyle = "#888";
        ctx.fillText("Refresh the page to take another contract.", canvas.width/2 - 180, canvas.height/2 + 40);
    }
}

// Core Game Sequence Loop
function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
}

loop();
</script>
</body>
</html>
