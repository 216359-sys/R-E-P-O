<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sonic 2D Momentum Prototype</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="hud">
        <div>SCORE: <span class="stat">000000</span></div>
        <div>TIME: <span id="uiTime" class="stat">0:00</span></div>
        <div>RINGS: <span id="uiRings" class="stat">00</span></div>
    </div>

    <canvas id="gameCanvas" width="800" height="480"></canvas>

    <div class="controls">
        [A / D] or [Left / Right Arrows] Move Left/Right | [SPACE] Jump / Spin Dash
    </div>

    <script src="game.js"></script>
</body>
</html>
